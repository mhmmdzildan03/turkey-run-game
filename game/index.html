<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — The Great Turkey Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a0e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; }
  #game canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="game" aria-label="Gobble Dash: a turkey escapes Thanksgiving dinner. Jump with Space, slide with Down, sprint with Shift."></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./pixi.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
